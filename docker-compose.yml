services:
  db:
    image: mysql:8.0
    container_name: yeo-mysql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeo-api
    env_file:
      - .env
    environment:
      DB_DRIVER: mysql+pymysql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_ECHO: ${DB_ECHO:-false}
      APP_ENV: ${APP_ENV:-prod}
      PORT: ${PORT:-8000}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_MIN: ${SESSION_MAX_MIN}
      SESSION_SAMESITE: ${SESSION_SAMESITE}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY}
      FRONT_ORIGINS: ${FRONT_ORIGINS}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8000"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  dbdata:

